# HTTP
quarkus.http.port=8085

# Frontend URL (used in email links ? frontend calls POST /api/users/activate with token in body)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
quarkus.log.category."io.quarkus.mailer".level=DEBUG
%prod.quarkus.log.category."io.quarkus.mailer".level=INFO

# Mailer (MailHog para desarrollo)
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.auth-methods=DISABLED
quarkus.mailer.from=${MAIL_FROM:noreply@kitti.es}
quarkus.mailer.mock=false
%dev.quarkus.mailer.mock=false

# Mailer (producción — SMTP real)
%prod.quarkus.mailer.start-tls=${MAIL_TLS:REQUIRED}
%prod.quarkus.mailer.auth-methods=${MAIL_AUTH_METHODS:PLAIN LOGIN}
%prod.quarkus.mailer.username=${MAIL_USERNAME:replace-me-in-prod}
%prod.quarkus.mailer.password=${MAIL_PASSWORD:replace-me-in-prod}

# Container image
quarkus.container-image.builder=jib
quarkus.container-image.group=ciscoadiz
quarkus.container-image.name=notification-service
quarkus.container-image.tag=latest

# User service (internal lookup for adopter email)
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.user-service.connect-timeout=2000
quarkus.rest-client.user-service.read-timeout=5000
%test.quarkus.rest-client.user-service.url=http://localhost:${quarkus.http.test-port}
kitties.internal.secret=${KITTIES_INTERNAL_SECRET:kitties-dev-secret}
%test.kitties.internal.secret=test-internal-secret

# IP geolocation (ip2location.io free tier — sin API key, 30k req/mes)
quarkus.rest-client.ip2location.url=${IP2LOCATION_URL:https://api.ip2location.io}
quarkus.rest-client.ip2location.connect-timeout=2000
quarkus.rest-client.ip2location.read-timeout=3000
%test.quarkus.rest-client.ip2location.url=http://localhost:${quarkus.http.test-port}

# Kafka
kafka.bootstrap.servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
mp.messaging.incoming.user-registered.connector=smallrye-kafka
mp.messaging.incoming.user-registered.topic=user-registered
mp.messaging.incoming.user-registered.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.user-registered.group.id=notification-service
mp.messaging.incoming.user-registered.failure-strategy=dead-letter-queue
mp.messaging.incoming.user-registered.dead-letter-queue.topic=user-registered-dlq
mp.messaging.incoming.adoption-form-analysed.connector=smallrye-kafka
mp.messaging.incoming.adoption-form-analysed.topic=adoption-form-analysed
mp.messaging.incoming.adoption-form-analysed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.adoption-form-analysed.group.id=notification-service
mp.messaging.incoming.adoption-form-analysed.failure-strategy=dead-letter-queue
mp.messaging.incoming.adoption-form-analysed.dead-letter-queue.topic=adoption-form-analysed-dlq
mp.messaging.incoming.adoption-request-accepted.connector=smallrye-kafka
mp.messaging.incoming.adoption-request-accepted.topic=adoption-request-accepted
mp.messaging.incoming.adoption-request-accepted.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.adoption-request-accepted.group.id=notification-service
mp.messaging.incoming.adoption-request-accepted.failure-strategy=dead-letter-queue
mp.messaging.incoming.adoption-request-accepted.dead-letter-queue.topic=adoption-request-accepted-dlq
mp.messaging.incoming.password-changed.connector=smallrye-kafka
mp.messaging.incoming.password-changed.topic=password-changed
mp.messaging.incoming.password-changed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.password-changed.group.id=notification-service
mp.messaging.incoming.password-changed.failure-strategy=dead-letter-queue
mp.messaging.incoming.password-changed.dead-letter-queue.topic=password-changed-dlq

mp.messaging.incoming.password-reset-requested.connector=smallrye-kafka
mp.messaging.incoming.password-reset-requested.topic=password-reset-requested
mp.messaging.incoming.password-reset-requested.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.password-reset-requested.group.id=notification-service
mp.messaging.incoming.password-reset-requested.failure-strategy=dead-letter-queue
mp.messaging.incoming.password-reset-requested.dead-letter-queue.topic=password-reset-requested-dlq

%test.mp.messaging.incoming.adoption-form-analysed.connector=smallrye-in-memory
%test.mp.messaging.incoming.adoption-request-accepted.connector=smallrye-in-memory
%test.mp.messaging.incoming.password-changed.connector=smallrye-in-memory
%test.mp.messaging.incoming.password-reset-requested.connector=smallrye-in-memory

# Test
%test.quarkus.mailer.mock=true
%test.mp.messaging.incoming.user-registered.connector=smallrye-in-memory
%test.quarkus.http.test-port=0

# Prod
%prod.quarkus.swagger-ui.enabled=false
%prod.quarkus.smallrye-openapi.enabled=false

# Database
quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.username=${DB_USER:kitties}
%dev.quarkus.datasource.password=${DB_PASSWORD:kitties}
%dev.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kitties}?search_path=notification
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kitties}

%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?search_path=notification
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

# Flyway
quarkus.flyway.enabled=false
%prod.quarkus.flyway.enabled=true
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.schemas=notification
%prod.quarkus.flyway.locations=classpath:db/migration

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.default-schema=notification
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.datasource.devservices.init-script-path=init-test.sql
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false

# JWT
mp.jwt.verify.issuer=https://www.kitti.es
mp.jwt.verify.publickey.location=publicKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:/run/secrets/publicKey.pem}

# CORS (frontend connects directly for SSE)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
%prod.quarkus.http.cors.origins=${CORS_ORIGIN:https://www.kitti.es}
quarkus.http.cors.methods=GET,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Type
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=notification-service
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.suppress-non-application-uris=true
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.sdk.disabled=true
