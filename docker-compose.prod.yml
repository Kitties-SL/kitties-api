name: kitties-prod

secrets:
  jwt_private_key:
    file: ./secrets/privateKey.pem
  jwt_public_key:
    file: ./secrets/publicKey.pem

networks:
  kitties-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  certbot_certs:
  certbot_www:
  kafka_data:

services:

  # ─── Infrastructure ───────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c max_connections=50
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'

  minio:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      KAFKA_LOG_RETENTION_HOURS: "12"
      KAFKA_LOG_SEGMENT_BYTES: "10485760"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 15s
      timeout: 35s
      retries: 5
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.75'

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run /etc/alloy/config.alloy
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      GRAFANA_PROMETHEUS_USER: ${GRAFANA_PROMETHEUS_USER}
      GRAFANA_TEMPO_URL: ${GRAFANA_TEMPO_URL}
      GRAFANA_TEMPO_USER: ${GRAFANA_TEMPO_USER}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY}
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ─── Application services ─────────────────────────────────────────

  user-service:
    image: ciscoadiz/user-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_GRPC_SERVER_PORT: 9090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SERVICE_URL: http://auth-service:8082
      ADOPTION_SERVICE_URL: http://adoption-service:8086
      CHAT_SERVICE_URL: http://chat-service:8089
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  auth-service:
    image: ciscoadiz/auth-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      USER_SERVICE_HOST: user-service
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_private_key
        target: /run/secrets/privateKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  storage-service:
    image: ciscoadiz/storage-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8083
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
      MINIO_URL: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      OTEL_ENDPOINT: http://alloy:4317
    depends_on:
      minio:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  cat-service:
    image: ciscoadiz/cat-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      STORAGE_SERVICE_URL: http://storage-service:8083
      ADOPTION_SERVICE_URL: http://adoption-service:8086
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      storage-service:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  notification-service:
    image: ciscoadiz/notification-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      USER_SERVICE_URL: http://user-service:8081
      CORS_ORIGIN: ${CORS_ORIGIN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_TLS: ${MAIL_TLS:-REQUIRED}
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.25'

  adoption-service:
    image: ciscoadiz/adoption-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      KITTIES_ID_NUMBER_KEY: ${KITTIES_ID_NUMBER_KEY}
      CAT_SERVICE_URL: http://cat-service:8084
      ORGANIZATION_SERVICE_URL: http://organization-service:8088
      USER_SERVICE_URL: http://user-service:8081
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  form-analysis-service:
    image: ciscoadiz/form-analysis-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      OTEL_ENDPOINT: http://alloy:4317
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  organization-service:
    image: ciscoadiz/organization-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  chat-service:
    image: ciscoadiz/chat-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8089
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  gateway-service:
    image: ciscoadiz/gateway-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SERVICE_URL: http://user-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      STORAGE_SERVICE_URL: http://storage-service:8083
      CAT_SERVICE_URL: http://cat-service:8084
      ADOPTION_SERVICE_URL: http://adoption-service:8086
      ORGANIZATION_SERVICE_URL: http://organization-service:8088
      CHAT_SERVICE_URL: http://chat-service:8089
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      OTEL_ENDPOINT: http://alloy:4317
    secrets:
      - source: jwt_public_key
        target: /run/secrets/publicKey.pem
    depends_on:
      user-service:
        condition: service_started
      auth-service:
        condition: service_started
      cat-service:
        condition: service_started
      adoption-service:
        condition: service_started
      organization-service:
        condition: service_started
      chat-service:
        condition: service_started
      notification-service:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  schedule-service:
    image: ciscoadiz/schedule-service:latest
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8090
      KITTIES_INTERNAL_SECRET: ${KITTIES_INTERNAL_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      ADOPTION_SERVICE_URL: http://adoption-service:8086
      CHAT_SERVICE_URL: http://chat-service:8089
      OTEL_ENDPOINT: http://alloy:4317
    depends_on:
      user-service:
        condition: service_started
      adoption-service:
        condition: service_started
      chat-service:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      gateway-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - kitties-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.10'
