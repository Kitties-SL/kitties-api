quarkus.http.port=8090

%dev.kitties.internal.secret=${KITTIES_INTERNAL_SECRET:kitties-dev-secret}
%prod.kitties.internal.secret=${KITTIES_INTERNAL_SECRET:replace-me-in-prod}
%test.kitties.internal.secret=test-internal-secret

quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.user-service.connect-timeout=2000
quarkus.rest-client.user-service.read-timeout=10000
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.auth-service.connect-timeout=2000
quarkus.rest-client.auth-service.read-timeout=10000
quarkus.rest-client.adoption-service.url=${ADOPTION_SERVICE_URL:http://localhost:8086}
quarkus.rest-client.adoption-service.connect-timeout=2000
quarkus.rest-client.adoption-service.read-timeout=10000
quarkus.rest-client.chat-service.url=${CHAT_SERVICE_URL:http://localhost:8089}
quarkus.rest-client.chat-service.connect-timeout=2000
quarkus.rest-client.chat-service.read-timeout=10000

%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0

# WireMock en puerto fijo — todos los clientes internos apuntan a él en tests
quarkus.wiremock.devservices.port=9001
%test.quarkus.rest-client.user-service.url=http://localhost:9001
%test.quarkus.rest-client.auth-service.url=http://localhost:9001
%test.quarkus.rest-client.adoption-service.url=http://localhost:9001
%test.quarkus.rest-client.chat-service.url=http://localhost:9001
# Delay 0 para que los reintentos no tarden 2 s cada uno en tests
%test.Retry/delay=0

quarkus.container-image.builder=jib
quarkus.container-image.group=ciscoadiz
quarkus.container-image.name=schedule-service
quarkus.container-image.tag=latest

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=schedule-service
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.suppress-non-application-uris=true
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.sdk.disabled=true